</style></head><body><div id="app"></div><script>window.COURSE_DATA={"modules":[{"id":"m0","title":"Bắt đầu từ bức tranh chung","eyebrow":"Khởi động","icon":"compass","subtitle":"Hiểu ngành, người tham gia và cách học","badge":"Chưa chuyên môn","source":null},{"id":"m1","title":"Pháp luật & các bên liên quan","eyebrow":"Pháp luật","icon":"scale","subtitle":"Biết ai có quyền, ai chịu trách nhiệm","badge":"Core","source":"law"},{"id":"m2","title":"Tiếp nhận hồ sơ & bàn giao","eyebrow":"Bàn giao","icon":"folders","subtitle":"Nhận diện hồ sơ và rủi ro khi tiếp nhận","badge":"Core","source":"handover"},{"id":"m3","title":"Tổ chức vận hành tòa nhà","eyebrow":"Vận hành","icon":"building","subtitle":"Từ tiền khai trương đến hoạt động hằng ngày","badge":"Core","source":"projects"},{"id":"m4","title":"Hợp đồng & nhà thầu","eyebrow":"Hợp đồng","icon":"file-check","subtitle":"Theo dõi chất lượng dịch vụ bằng bằng chứng","badge":"Core","source":"contracts"},{"id":"m5","title":"Tài chính & ngân sách","eyebrow":"Tài chính","icon":"wallet","subtitle":"Hiểu nguồn thu, chi phí và kiểm soát ngân sách","badge":"Core","source":"finance"}],"sources":{"law":{"name":"Tổng hợp các văn bản luật – VSIP Bắc Ninh","short":"Pháp luật","file":"PDF - BUỔI 1 - TỔNG HỢP CÁC VĂN BẢN LUẬT - VSIP BAC NINH.pdf","pages":60,"remark":"Slide giảng viên Nguyễn Duy Thành; một số điều khoản có thể đã sửa đổi."},"contracts":{"name":"Chuyên đề 2 – Hợp đồng QLVH chung cư","short":"Hợp đồng","file":"CHUYÊN ĐỀ 2 - HĐ QLVH CHUNG CƯ.pdf","pages":54,"remark":"Slide giảng viên Nguyễn Duy Thành, Global Home."},"projects":{"name":"Quản lý dự án","short":"Quản lý dự án","file":"QUAN LY DU AN.pdf","pages":33,"remark":"Slide của Viện Đào tạo và Hợp tác Giáo dục."},"finance":{"name":"Quản lý tài chính","short":"Quản lý tài chính","file":"QUẢN LÝ TÀI CHÍNH.pdf","pages":30,"remark":"Slide của Viện Đào tạo và Hợp tác Giáo dục."},"handover":{"name":"Kiến thức cơ bản về tiếp nhận hồ sơ nhà chung cư (1)","short":"Tiếp nhận hồ sơ","file":"KIẾN THỨC CƠ BẢN VỀ TIẾP NHẬN HỒ SƠ NHÀ CHUNG CƯ (1).pdf","pages":47,"remark":"Bản 47 trang được chọn làm nguồn; có viện dẫn pháp luật năm 2026 cần kiểm tra."}},"lessons":[{"id":"m0l1","module":"m0","title":"Nghề quản lý vận hành làm gì?","source":null,"pages":"","why":"Đi làm trong tòa nhà không chỉ là sửa chữa: đó là phối hợp con người, dịch vụ, tài sản và rủi ro.","points":[{"label":"Định nghĩa công việc","body":"Quản lý vận hành tổ chức nguồn lực để tòa nhà hoạt động ổn định, an toàn, đúng cam kết dịch vụ."},{"label":"Nhóm công việc","body":"Một ban quản lý thường kết nối chăm sóc cư dân, an ninh, vệ sinh, kỹ thuật, hành chính và tài chính."},{"label":"Vai trò điều phối","body":"Nhiều vấn đề phải chuyển đúng người xử lý và theo dõi đến khi khép lại, không phải tự xử lý mọi việc."}],"example":"Cư dân báo sảnh thang máy bẩn và đèn hành lang chập chờn. Người điều phối ghi nhận, giao việc cho hai bộ phận khác nhau, rồi kiểm tra kết quả và phản hồi cư dân.","deep":"Tóm lược từ sơ đồ tổ chức và các nhóm công việc trong Quản lý dự án, tr.25–33; Quản lý tài chính, tr.5–6.","time":6},{"id":"m0l2","module":"m0","title":"Ai là ai trong một chung cư?","source":null,"pages":"","why":"Phân biệt đúng các bên giúp tránh nhầm thẩm quyền khi đọc hợp đồng hoặc tiếp nhận phản ánh.","points":[{"label":"Chủ đầu tư","body":"Gắn với việc phát triển dự án, cung cấp hồ sơ, bàn giao và trách nhiệm tương ứng theo pháp luật."},{"label":"Hội nghị và Ban quản trị","body":"Hội nghị là cơ chế để các chủ sở hữu quyết định vấn đề thuộc thẩm quyền; Ban quản trị thực hiện các công việc được giao."},{"label":"Đơn vị quản lý vận hành","body":"Doanh nghiệp tổ chức cung cấp dịch vụ vận hành theo hợp đồng và điều kiện pháp luật."},{"label":"Ban quản lý tại tòa nhà","body":"Nhóm trực tiếp triển khai dịch vụ, tiếp nhận thông tin, điều phối nhà thầu và báo cáo."}],"example":"Một cư dân đề nghị thay đơn vị vận hành. Nhân viên không được tự quyết; cần xác định quy trình, thẩm quyền của Hội nghị/Ban quản trị và hợp đồng đang có.","deep":"Tài liệu luật tr.11–33; tài liệu tài chính tr.4–7.","time":7},{"id":"m0l3","module":"m0","title":"Cách học để nhớ và áp dụng","source":null,"pages":"","why":"Đọc liên tục 200 trang slide không tự động trở thành khả năng làm việc.","points":[{"label":"Bước 1 – Nắm ý chính","body":"Mỗi bài tập trung vào một vấn đề: vì sao quan trọng, cần biết gì, dùng khi nào."},{"label":"Bước 2 – Tự gợi nhớ","body":"Trả lời câu hỏi ngắn trước khi xem đáp án để phát hiện phần chưa chắc."},{"label":"Bước 3 – Thử làm","body":"Hoàn thành nhiệm vụ mô phỏng: checklist, ghi nhận sự cố, hợp đồng hoặc ngân sách."},{"label":"Bước 4 – Ôn lại","body":"Quay lại thẻ thuật ngữ và bài làm sai; không cần học hết trong một lần."}],"example":"Sau khi đọc bài về hồ sơ hoàn công, hãy đóng bài học và tự liệt kê xem hồ sơ đó dùng để làm gì, trước khi mở lại đối chiếu.","deep":"Hướng dẫn học tập do ứng dụng thiết kế, không phải nội dung quy định của PDF.","time":5},{"id":"m1l1","module":"m1","title":"Phần sở hữu riêng và phần sở hữu chung","source":"law","pages":"5–6","why":"Mọi tranh luận về sửa chữa, chi phí và sử dụng không gian đều có thể bắt đầu từ câu hỏi sở hữu.","points":[{"label":"Sở hữu riêng","body":"Tài liệu nhắc đến phần diện tích căn hộ và trang thiết bị sử dụng riêng gắn với căn hộ; cần đối chiếu hợp đồng và hồ sơ dự án."},{"label":"Sở hữu chung","body":"Bao gồm những bộ phận, kết cấu, thiết bị và diện tích dùng chung theo quy định và hồ sơ xác lập."},{"label":"Đừng suy đoán theo vị trí","body":"Một không gian ở sát căn hộ chưa chắc là sở hữu riêng; cần kiểm tra căn cứ pháp lý và bản vẽ."},{"label":"Tác động vận hành","body":"Phân loại sở hữu quyết định việc quản lý, bảo trì, sử dụng và phân bổ trách nhiệm."}],"example":"Cư dân muốn đặt tủ trong hành lang tầng. Trước khi chấp thuận, Ban quản lý phải kiểm tra nội quy, hồ sơ diện tích chung và yêu cầu an toàn.","deep":"Tài liệu trích Điều 142 Luật Nhà ở 2023; xem trạng thái hiệu lực văn bản cập nhật.","time":7},{"id":"m1l2","module":"m1","title":"Diện tích căn hộ và chỗ để xe","source":"law","pages":"6–10","why":"Hai chủ đề dễ phát sinh phản ánh và tranh chấp tại dự án.","points":[{"label":"Diện tích sử dụng","body":"Slide giới thiệu cách đo thông thủy và những phần không tính vào diện tích căn hộ."},{"label":"Chỗ để xe","body":"Tài liệu dành nhiều trang để phân biệt vị trí, quyền sở hữu và phương án quản lý theo loại chỗ đỗ."},{"label":"Chứng cứ cần xem","body":"Hợp đồng mua bán, bản vẽ được phê duyệt, hồ sơ phân định và nội quy vận hành."},{"label":"Ứng xử nghiệp vụ","body":"Không kết luận quyền sở hữu chỉ dựa trên lời nói hoặc cách sử dụng lâu nay."}],"example":"Hai cư dân tranh luận về quyền ưu tiên một ô đỗ xe. Người tiếp nhận nên lập phiếu phản ánh, yêu cầu hồ sơ liên quan và chuyển đúng bộ phận.","deep":"Điều 143–144 trong slide; cách áp dụng thực tế tùy hồ sơ và quy định hiện hành.","time":7},{"id":"m1l3","module":"m1","title":"Hội nghị nhà chung cư","source":"law","pages":"11–13","why":"Nhiều quyết định lớn về vận hành không do nhân viên hiện trường tự đưa ra.","points":[{"label":"Vai trò","body":"Hội nghị là cơ chế thảo luận và thông qua các nội dung thuộc thẩm quyền trong quản lý sử dụng chung cư."},{"label":"Quyết định","body":"Slide trình bày đối tượng tham gia, nội dung biểu quyết và các bước lập quyết định."},{"label":"Giá trị công việc","body":"Nhân viên vận hành cần biết quyết định nào là căn cứ để triển khai, và lưu được nghị quyết, biên bản."},{"label":"Giới hạn","body":"Điều kiện biểu quyết, tỷ lệ và thẩm quyền cụ thể cần kiểm tra văn bản áp dụng đang có hiệu lực."}],"example":"Tòa nhà muốn đổi phương án vệ sinh. Trưởng ban quản lý cần xem đó là điều chỉnh vận hành trong hợp đồng hay thay đổi thuộc thẩm quyền Hội nghị.","deep":"Theo Điều 145 trong slide pháp luật.","time":7},{"id":"m1l4","module":"m1","title":"Ban quản trị: cơ cấu và nhiệm vụ","source":"law","pages":"14–17","why":"Ban quản trị và Ban quản lý nghe giống nhau nhưng không phải một.","points":[{"label":"Ban quản trị","body":"Có vai trò đại diện, quản trị theo quy định; việc thành lập và mô hình phụ thuộc loại nhà chung cư."},{"label":"Ban quản lý","body":"Là bộ phận làm việc tại dự án, phối hợp dịch vụ và chịu sự tổ chức của đơn vị vận hành."},{"label":"Đầu mối trao đổi","body":"Các đề xuất phí, hợp đồng, bảo trì, chất lượng dịch vụ cần chuyển đúng người/phạm vi phê duyệt."},{"label":"Giới hạn chức năng","body":"Không dùng chức danh Trưởng ban quản lý để thay cho quyền hạn của Ban quản trị."}],"example":"Một nhân viên nhận yêu cầu “đổi nhà thầu” từ cá nhân cư dân. Cần báo cáo, kiểm tra hợp đồng và thẩm quyền chứ không tự ký nhà thầu mới.","deep":"Trang 14–17, Điều 146 và nội dung tổ chức BQT.","time":7},{"id":"m1l5","module":"m1","title":"Quyền và trách nhiệm của Ban quản trị","source":"law","pages":"18–28","why":"Quản lý tốt bắt đầu từ hiểu đúng ai có quyền quyết định và ai phải giải trình.","points":[{"label":"Quyền cơ bản","body":"Slide nêu các nhóm quyền liên quan đến quản lý, lựa chọn đơn vị vận hành, kinh phí và yêu cầu thông tin."},{"label":"Trách nhiệm","body":"Tổ chức thực hiện quyết định đúng thẩm quyền; quản lý, giám sát và công khai những nội dung liên quan."},{"label":"Kiểm soát bằng hồ sơ","body":"Biên bản, báo cáo, quyết định và chứng từ quan trọng hơn chỉ đạo miệng."},{"label":"Xử lý vi phạm","body":"Một hành vi sai có thể dẫn tới tranh chấp hoặc trách nhiệm pháp lý; không tự giải quyết ngoài thẩm quyền."}],"example":"Ban quản trị yêu cầu báo cáo hạng mục bảo trì. Ban quản lý cần cung cấp số liệu và chứng cứ, không chỉ báo “đã xử lý”.","deep":"Trang 18–28 dẫn Điều 147–148 Luật Nhà ở 2023.","time":8},{"id":"m1l6","module":"m1","title":"Đơn vị quản lý vận hành và điều kiện","source":"law","pages":"29–33","why":"Nhà tuyển dụng trong lĩnh vực này thường cần nhân sự hiểu trách nhiệm của doanh nghiệp vận hành.","points":[{"label":"Đơn vị QLVH","body":"Là tổ chức thực hiện các công việc vận hành theo điều kiện chuyên môn và hợp đồng."},{"label":"Dịch vụ","body":"Gắn với vận hành hệ thống kỹ thuật và cung cấp dịch vụ vệ sinh, an ninh, chăm sóc, bảo trì theo phân công."},{"label":"Điều kiện pháp lý","body":"Slide trích Điều 149–150 và quy định hồ sơ, nhân sự; cần kiểm tra bản hợp nhất hiện hành."},{"label":"Nhân viên và chứng nhận","body":"Chứng nhận bồi dưỡng hỗ trợ kiến thức nghiệp vụ; không thay thế bằng chuyên môn kỹ thuật hoặc kinh nghiệm."}],"example":"Nhà tuyển dụng phỏng vấn: “Đơn vị vận hành khác ban quản trị ở đâu?” Bạn cần giải thích vai trò hợp đồng và thực thi.","deep":"Đối chiếu Điều 149–150 trên slide với quy định mới nhất.","time":8},{"id":"m1l7","module":"m1","title":"Giá dịch vụ quản lý vận hành","source":"law","pages":"34–36","why":"Cư dân thường hỏi tiền phí dùng vào việc gì và ai có quyền điều chỉnh.","points":[{"label":"Bản chất phí","body":"Phục vụ những công việc quản lý vận hành theo phạm vi dịch vụ và phương án tài chính."},{"label":"Không nhập nhằng","body":"Slide nhắc phải phân biệt phí vận hành với các khoản khác như kinh phí bảo trì."},{"label":"Minh bạch","body":"Cần có phương pháp, căn cứ, hợp đồng và quyết định hợp lệ; tránh trả lời bằng suy đoán."},{"label":"Liên hệ tài chính","body":"Bạn sẽ học cách lập ngân sách và cân đối các khoản thu chi ở module 5."}],"example":"Cư dân phản ánh phí tăng nhưng dịch vụ không khác. Người điều phối ghi nhận tiêu chí dịch vụ, kỳ áp dụng và chuyển đúng đầu mối giải thích.","deep":"Trang 34–36, Điều 151 Luật Nhà ở 2023.","time":7},{"id":"m1l8","module":"m1","title":"Bảo trì, quyền cư dân và giải quyết tranh chấp","source":"law","pages":"44–59","why":"Hiểu mối liên hệ giữa bảo trì, trách nhiệm các bên và quy trình giải quyết tranh chấp.","points":[{"label":"Quy chế chung","body":"Slide Thông tư 05 trình bày các nội dung quản lý, hội nghị, Ban quản trị, dịch vụ và bảo trì."},{"label":"Bảo trì","body":"Cần phân biệt kế hoạch, hạng mục được bảo trì, kiểm soát chi và giám sát nghiệm thu."},{"label":"Quyền cư dân","body":"Cần truyền thông nội quy, cơ chế phản ánh và xử lý theo trách nhiệm."},{"label":"Tranh chấp","body":"Thu thập chứng cứ và chuyển đúng người/thẩm quyền, tránh hứa hẹn kết quả pháp lý."}],"example":"Cư dân nói cửa thoát hiểm bị chặn. Hãy ưu tiên an toàn, ghi nhận bằng chứng, liên hệ đúng người xử lý ngay và theo dõi kết quả.","deep":"Trang 44–59 tập hợp nội dung quy chế theo Thông tư 05/2024/TT-BXD.","time":8},{"id":"m2l1","module":"m2","title":"Bàn giao hồ sơ: vì sao quan trọng?","source":"handover","pages":"6–9","why":"Không có hồ sơ đầy đủ, nhân sự vận hành khó xác định hệ thống, lịch bảo hành và trách nhiệm.","points":[{"label":"Hồ sơ nhà ở","body":"Slide dẫn Điều 119–120 về lập, lưu trữ và quản lý hồ sơ."},{"label":"Trước bàn giao","body":"Dự án cần hồ sơ nghiệm thu, tài liệu PCCC, bản vẽ và các tài liệu khác theo quy định."},{"label":"Bàn giao bằng văn bản","body":"Danh mục, tình trạng tài liệu, người giao – nhận và ngày tháng nên rõ ràng."},{"label":"Bài học nghề","body":"Người tiếp nhận giỏi phát hiện thiếu sót trước khi ký xác nhận, không chỉ đếm số tập giấy."}],"example":"Nhà thầu bàn giao bản vẽ PDF nhưng không có danh mục trang. Hãy ghi mục “thiếu danh mục bản vẽ” vào biên bản thay vì tự coi đã đủ.","deep":"Trích Điều 119–120 và Điều 24 Nghị định 95 trong slide.","time":7},{"id":"m2l2","module":"m2","title":"Ai bàn giao, ai tiếp nhận, ai lưu?","source":"handover","pages":"9–13","why":"Sai đầu mối bàn giao có thể khiến hồ sơ thất lạc hoặc không xác định được trách nhiệm.","points":[{"label":"Chủ đầu tư","body":"Tài liệu mô tả trách nhiệm lập và bàn giao hồ sơ nhà chung cư."},{"label":"Ban quản trị","body":"Tiếp nhận và lưu trữ theo quy định; trong trường hợp có đơn vị vận hành, cơ chế cung cấp hồ sơ cần rõ."},{"label":"Biên bản bàn giao","body":"Ghi nhận hiện trạng, danh mục, người ký và tài liệu còn thiếu."},{"label":"Kiểm đếm tại hiện trường","body":"Hồ sơ cần gắn với việc đối chiếu trang thiết bị và phần sở hữu chung thực tế."}],"example":"Một máy bơm có trên danh mục nhưng chưa tìm thấy ngoài hiện trường. Hãy ghi ngoại lệ và yêu cầu làm rõ, không ký “đủ 100%”.","deep":"Trang 9–13 dẫn Điều 10–11 Quy chế và quy trình kiểm đếm.","time":8},{"id":"m2l3","module":"m2","title":"Nhóm hồ sơ pháp lý","source":"handover","pages":"16–20","why":"Hồ sơ pháp lý giúp kiểm tra căn cứ đưa công trình vào sử dụng và trách nhiệm của các bên.","points":[{"label":"Các nhóm cần nhận diện","body":"Hồ sơ dự án, các văn bản nghiệm thu/chấp thuận và giấy tờ liên quan phải được liệt kê theo danh mục thực tế."},{"label":"Mục đích sử dụng","body":"Chứng minh căn cứ nghiệm thu và quyền quản lý tài sản, hỗ trợ đối chiếu khi có tranh chấp."},{"label":"Cách kiểm tra","body":"Xem tên tài liệu, cơ quan/đơn vị phát hành, mã hiệu, ngày tháng và tình trạng bản."},{"label":"Tình trạng pháp lý","body":"Không tự kết luận một giấy tờ hết/hợp lệ chỉ từ tên file; cần bộ phận chuyên môn xác minh."}],"example":"Nhân viên thấy hai biên bản nghiệm thu cùng tên nhưng số hiệu khác. Hãy lưu riêng và hỏi đầu mối giải thích quan hệ giữa hai biên bản.","deep":"Các trang 16–20 có nhiều hình hồ sơ mẫu; trong ứng dụng chỉ tóm tắt, không tái đăng bản mẫu.","time":8},{"id":"m2l4","module":"m2","title":"Hồ sơ kỹ thuật, thiết bị và bảo hành","source":"handover","pages":"20–25","why":"Bản vẽ và tài liệu thiết bị là “bản đồ” cho bảo trì và xử lý sự cố.","points":[{"label":"Hồ sơ kỹ thuật","body":"Nhận diện bản vẽ hoàn công, tài liệu nguồn gốc thiết bị và hợp đồng lắp đặt."},{"label":"Quy trình vận hành","body":"Các hệ thống cần hướng dẫn vận hành, bảo dưỡng và thông số kỹ thuật."},{"label":"Bảo hành","body":"Danh sách thời hạn bảo hành và nhà cung cấp giúp xác định đầu mối xử lý."},{"label":"Kiểm soát phiên bản","body":"Bản vẽ đang sử dụng phải đối chiếu với bản bàn giao cuối cùng, không mặc nhiên dùng bản thiết kế ban đầu."}],"example":"Khi máy phát điện báo lỗi, không nên mò vận hành theo trí nhớ. Đội kỹ thuật cần tra cứu hướng dẫn, đầu mối bảo hành và thực hiện theo quy trình an toàn.","deep":"Các trang 20–25 và nội dung bàn giao tại trang 10 của PDF.","time":8},{"id":"m2l5","module":"m2","title":"PCCC, môi trường và khu vực chung","source":"handover","pages":"25–30","why":"Một tòa nhà an toàn đòi hỏi bộ hồ sơ kỹ thuật đi đôi với chứng từ nghiệm thu và tài liệu liên quan.","points":[{"label":"PCCC","body":"Slide liệt kê những hồ sơ liên quan đến chấp thuận/nghiệm thu và hệ thống PCCC."},{"label":"Môi trường","body":"Có nội dung hồ sơ về xử lý nước thải và đánh giá/kế hoạch bảo vệ môi trường."},{"label":"Khu để xe","body":"Bản vẽ mặt bằng có phân định khu vực để xe cho các nhóm chủ thể."},{"label":"Cách xử lý","body":"Khi thiếu tài liệu, phải ghi nhận ngoại lệ và chuyển người có thẩm quyền/chuyên môn kiểm tra."}],"example":"Trong buổi tiếp nhận, hồ sơ hệ thống xử lý nước thải thiếu biên bản nghiệm thu. Người tiếp nhận cần ghi nhận thiếu và yêu cầu bổ sung trước bước xác nhận.","deep":"Trang 25–30 và Điều 24 Nghị định 95 trích trên slide.","time":7},{"id":"m2l6","module":"m2","title":"Kinh phí bảo trì và rủi ro bàn giao","source":"handover","pages":"31–43","why":"Hồ sơ bàn giao và bàn giao tiền kinh phí bảo trì có liên quan nhưng không phải một việc.","points":[{"label":"Kinh phí bảo trì","body":"Đây là khoản quản lý theo quy định riêng cho bảo trì phần sở hữu chung; khác phí quản lý vận hành thường kỳ."},{"label":"Bàn giao","body":"Slide trích Điều 153–154 Luật Nhà ở và trình tự yêu cầu/cưỡng chế trong văn bản hướng dẫn."},{"label":"Bằng chứng cần bảo quản","body":"Số dư, chứng từ ngân hàng, biên bản đối chiếu, quyết định và biên bản bàn giao."},{"label":"Cẩn trọng pháp lý","body":"Các trang đề cập thẩm quyền hành chính có thể chịu ảnh hưởng thay đổi tổ chức chính quyền và văn bản năm 2026."}],"example":"Trong báo cáo, số dư quỹ bảo trì không khớp sổ đối chiếu. Cần lập bảng chênh lệch và yêu cầu xác minh, không tự điều chỉnh tiền.","deep":"Trang 31–43; nội dung pháp lý cần rà soát hiệu lực.","time":9},{"id":"m2l7","module":"m2","title":"Đọc bản vẽ và kết thúc checklist bàn giao","source":"handover","pages":"44–47","why":"Đọc bản vẽ đúng ở mức nhận diện giúp giao việc chính xác và giảm rủi ro điều phối.","points":[{"label":"Bản vẽ hoàn công","body":"Phản ánh hiện trạng hoàn thành công trình theo hồ sơ được lập; phân biệt với bản thiết kế trước thi công."},{"label":"Mã hiệu","body":"Tìm tên bản vẽ, tỉ lệ, ngày, ký hiệu, hạng mục và dấu nhận diện phiên bản."},{"label":"Chuyển tuyến chuyên môn","body":"Người không có chuyên môn kỹ thuật không tự phê duyệt an toàn kết cấu hay thông số thiết bị."},{"label":"Kết thúc bàn giao","body":"Biên bản phải có danh mục, tình trạng, người chịu trách nhiệm bổ sung và mốc theo dõi."}],"example":"Đội vận hành cần xác định sơ đồ cấp nước tầng 12. Người điều phối tìm đúng bản vẽ theo danh mục và chuyển kỹ thuật đối chiếu.","deep":"Trang 44–47 sử dụng nhiều hình ảnh bản vẽ nên cần đối chiếu trực tiếp trên tài liệu gốc.","time":8},{"id":"m3l1","module":"m3","title":"Hai giai đoạn của vòng đời vận hành","source":"projects","pages":"2–6","why":"Pre-opening và hoạt động thường kỳ yêu cầu hai cách tổ chức công việc khác nhau.","points":[{"label":"Pre-opening","body":"Chuẩn bị trước khi tòa nhà vận hành chính thức: hồ sơ, nhân sự, hệ thống, nhà thầu, ngân sách."},{"label":"Operations","body":"Duy trì dịch vụ ổn định, an toàn, kiểm soát chi phí và xử lý tình huống trong quá trình vận hành."},{"label":"Liên tục","body":"Công việc chuẩn bị càng cẩn thận thì quá trình chuyển sang hoạt động càng ít vướng mắc."},{"label":"Tư duy quản lý","body":"Luôn xác định việc nào phải hoàn thành trước khi cư dân sử dụng dịch vụ."}],"example":"Một dự án chuẩn bị đón cư dân nhưng chưa có danh sách nhà thầu bảo vệ. Đây là rủi ro pre-opening cần xử lý trước ngày bàn giao.","deep":"Trang 2–6 và định nghĩa giai đoạn vận hành ở trang 25.","time":7},{"id":"m3l2","module":"m3","title":"Thiết kế bộ máy và bố trí nhân sự","source":"projects","pages":"7–8","why":"Chất lượng vận hành phụ thuộc rõ vai trò và khả năng phối hợp.","points":[{"label":"Sơ đồ tổ chức","body":"Slide nêu Trưởng Ban quản lý, hành chính, dịch vụ khách hàng, kế toán, kỹ thuật và giám sát."},{"label":"Mô tả công việc","body":"Cần có nhiệm vụ, ca làm, người báo cáo, quyền phê duyệt và người thay thế."},{"label":"Đào tạo nhân sự","body":"Kế hoạch đào tạo đi cùng lộ trình nhận bàn giao và đưa dự án vào hoạt động."},{"label":"Điểm chạm","body":"Một sự cố có thể cần an ninh, kỹ thuật, chăm sóc cư dân cùng phối hợp."}],"example":"Một nhân viên ca tối không biết ai thay Trưởng ca khi nghỉ phép. Ban quản lý phải có danh sách liên hệ và quy trình bàn giao ca.","deep":"Trang 7–8 của tài liệu dự án.","time":7},{"id":"m3l3","module":"m3","title":"Ngân sách tiền khai trương","source":"projects","pages":"9–12","why":"Dự án chưa hoạt động vẫn có những khoản chi thiết yếu cần dự tính.","points":[{"label":"Chi phí chuẩn bị","body":"Văn phòng Ban quản lý, trang thiết bị, vật tư, nhân sự và các hạng mục khởi động."},{"label":"Quy trình kế toán","body":"Tài liệu yêu cầu thiết lập quy trình tài chính trước ngày dự án hoạt động."},{"label":"Dự toán phí","body":"Rà soát các mức phí liên quan đến vận hành, thi công và sử dụng hệ thống theo bối cảnh dự án."},{"label":"Điều chỉnh thực tế","body":"Ngân sách phải phản ánh tiến độ bàn giao và phạm vi công việc, không chỉ là bảng chi cố định."}],"example":"Lịch bàn giao sớm hơn dự kiến hai tuần. Cần rà soát chi phí tăng ca, bổ sung nhân sự tiếp đón và vật tư vận hành.","deep":"Trang 9–12 của tài liệu dự án; môn quản lý tài chính sẽ đi sâu hơn.","time":7},{"id":"m3l4","module":"m3","title":"An toàn lao động, hồ sơ và sổ tay cư dân","source":"projects","pages":"13–16","why":"Quy trình và thông tin sẵn có giúp giảm nguy cơ khi tòa nhà bắt đầu sử dụng.","points":[{"label":"An toàn","body":"Tài liệu yêu cầu nội quy làm việc, huấn luyện an toàn và quy trình ứng phó sự cố."},{"label":"Hồ sơ","body":"Lập danh sách hồ sơ pháp lý, môi trường, PCCC và các đầu mục liên quan."},{"label":"Sổ tay cư dân","body":"Gồm nội quy, đầu mối liên hệ, tiện ích, quyền và nghĩa vụ và thông tin khẩn cấp."},{"label":"Truyền thông","body":"Người dân cần biết cách báo sự cố và nhận phản hồi, không chỉ nhận một tập tài liệu."}],"example":"Trước ngày cư dân nhận nhà, số trực sự cố bị thiếu trên bảng tin. Cần kiểm tra danh bạ và thông báo lại trước khi phát sinh tình huống.","deep":"Trang 13–16.","time":7},{"id":"m3l5","module":"m3","title":"Tiếp nhận tài sản và chuẩn bị nhà thầu","source":"projects","pages":"17–24","why":"Bàn giao không chỉ là ký hồ sơ; còn là xác định tài sản, cấu hình hệ thống và nhà cung cấp.","points":[{"label":"Kiểm kê","body":"Tài sản gắn liền và tài sản rời được lập danh mục, số lượng và tình trạng."},{"label":"Hệ thống kỹ thuật","body":"Nhận bản vẽ, quy trình vận hành, thời hạn bảo hành, danh sách vật tư và thông tin liên hệ."},{"label":"Nhà thầu phụ","body":"Đánh giá nhu cầu, ngân sách, năng lực, hợp đồng và thời điểm triển khai."},{"label":"Vấn đề ưu tiên","body":"Bãi xe, cổng ra vào, camera, thẻ cư dân và hồ sơ dữ liệu người sử dụng cần chuẩn bị sớm."}],"example":"Bãi xe chưa có phương án phân luồng trước ngày nhận nhà. Điều phối viên phải báo cáo rủi ro, đề nghị kiểm tra hiện trường và chốt đầu mối xử lý.","deep":"Trang 17–24.","time":9},{"id":"m3l6","module":"m3","title":"Quản lý dịch vụ và chăm sóc cư dân","source":"projects","pages":"25–29","why":"Đây là cụm nghiệp vụ sát nhất với nhóm việc làm giám sát dịch vụ và chăm sóc cư dân.","points":[{"label":"Chất lượng dịch vụ","body":"Bảo vệ, vệ sinh, cảnh quan, rác thải, diệt côn trùng và kiểm soát bảo trì phải theo tiêu chuẩn."},{"label":"Vật tư tiêu hao","body":"Theo dõi sử dụng, tồn kho, chất lượng và so sánh với ngân sách."},{"label":"Dữ liệu cư dân","body":"Quản lý danh sách và thông tin liên hệ phải phù hợp yêu cầu bảo vệ thông tin cá nhân."},{"label":"Chăm sóc khách hàng","body":"Giải đáp, ghi nhận khiếu nại, chuyển xử lý và phản hồi theo quy trình."}],"example":"Cư dân báo vệ sinh tầng hầm kém ba ngày liên tục. Không chỉ báo lại nhà thầu: cần kiểm tra KPI, nhật ký vệ sinh, ảnh hiện trạng và thời hạn khắc phục.","deep":"Trang 25–29.","time":8},{"id":"m3l7","module":"m3","title":"Quản lý tài sản, rủi ro và báo cáo","source":"projects","pages":"30–33","why":"Nhân viên vận hành chứng minh kết quả bằng dữ liệu theo dõi và báo cáo.","points":[{"label":"Tài sản và CCDC","body":"Lập danh mục, kiểm kê định kỳ, kiểm soát nhập – xuất – tồn và vật tư tiêu hao."},{"label":"Ngân sách","body":"Theo dõi phải thu, phải chi và so sánh chi phí với ngân sách."},{"label":"Quản trị rủi ro","body":"Dự đoán nguy cơ, đánh giá ảnh hưởng, lập quy trình kiểm soát và chuẩn bị phương án ứng phó."},{"label":"Báo cáo","body":"Tổng hợp triển khai tuần/tháng, thu chi, công nợ, bất cập và kiến nghị."}],"example":"Báo cáo tháng không chỉ ghi “mọi việc bình thường”; hãy nêu vấn đề tồn đọng, tác động, hướng xử lý và thời hạn.","deep":"Trang 30–33.","time":8},{"id":"m4l1","module":"m4","title":"Hợp đồng là công cụ giao việc và kiểm soát","source":"contracts","pages":"4–10","why":"Một tòa nhà có thể hoạt động kém không phải vì thiếu người mà vì phạm vi công việc không rõ.","points":[{"label":"Bản chất","body":"Tài liệu trình bày hợp đồng là thỏa thuận xác lập quyền, nghĩa vụ giữa các bên."},{"label":"Các nhóm hợp đồng","body":"Quản lý vận hành, bảo trì, dịch vụ và khai thác tài sản chung."},{"label":"Công dụng","body":"Hợp đồng hỗ trợ giao việc, kiểm soát chất lượng, thanh toán, phân định trách nhiệm và giải quyết tranh chấp."},{"label":"Nguyên tắc","body":"Phải rõ ràng, có căn cứ, đúng thẩm quyền và dễ kiểm chứng việc thực hiện."}],"example":"Hợp đồng vệ sinh chỉ ghi “đảm bảo sạch sẽ” mà không có tần suất. Khi tranh chấp xảy ra sẽ khó đo lường.","deep":"Trang 4–10.","time":7},{"id":"m4l2","module":"m4","title":"Phạm vi hợp đồng dịch vụ QLVH","source":"contracts","pages":"11–14","why":"Trách nhiệm chỉ kiểm soát được khi phạm vi công việc mô tả đủ chi tiết.","points":[{"label":"Thông tin và đối tượng","body":"Tên pháp nhân, đại diện, phạm vi tòa nhà và thời hạn cần rõ."},{"label":"Phạm vi dịch vụ","body":"Tài liệu minh họa hành chính, dịch vụ khách hàng, an ninh, vệ sinh, kỹ thuật."},{"label":"Biên giới trách nhiệm","body":"Nêu việc thuộc hợp đồng và việc phát sinh cần duyệt riêng."},{"label":"Cách quản trị","body":"Dùng bảng dịch vụ – đơn vị phụ trách – tần suất – bằng chứng."}],"example":"Có tranh cãi ai trả phí vệ sinh kính ngoài tòa nhà. Trước hết phải kiểm tra điều khoản phạm vi và phụ lục dịch vụ.","deep":"Trang 11–14: các điều khoản đầu tiên trong 15 nội dung hợp đồng.","time":7},{"id":"m4l3","module":"m4","title":"Nhân sự và KPI dịch vụ","source":"contracts","pages":"15–16","why":"Người giám sát cần đo được chất lượng, không chỉ nhìn số lượng người có mặt.","points":[{"label":"Nhân sự","body":"Hợp đồng cần xác định số lượng, vai trò, thời gian, năng lực hoặc phương án thay thế."},{"label":"KPI","body":"Các chỉ số chất lượng cần đo được: độ sạch, tần suất tuần tra, thời gian phản hồi, số lỗi tồn."},{"label":"Bằng chứng","body":"Nhật ký, hình ảnh, báo cáo và biên bản kiểm tra giúp đánh giá khách quan."},{"label":"Cảnh báo","body":"Không được tự tạo mức phạt/tiêu chuẩn chưa có trong hợp đồng."}],"example":"Nhà thầu bảo vệ có đủ người nhưng bỏ sót tuần tra. Hãy đo cả quân số lẫn mức thực hiện nhiệm vụ.","deep":"Trang 15–16, Điều khoản 4–5.","time":7},{"id":"m4l4","module":"m4","title":"Giá, thanh toán và trách nhiệm","source":"contracts","pages":"17–21","why":"Thiếu cơ chế thanh toán và trách nhiệm rõ ràng dễ dẫn tới tranh chấp.","points":[{"label":"Giá dịch vụ","body":"Nêu giá, cách tính, điều kiện điều chỉnh và các khoản bao gồm/không bao gồm."},{"label":"Thanh toán","body":"Cần quy định hồ sơ, thời hạn, nghiệm thu và chứng từ."},{"label":"Quyền BQT","body":"Gắn với quyền giám sát, yêu cầu chất lượng và trách nhiệm quyết định trong phạm vi hợp pháp."},{"label":"PCCC và trách nhiệm","body":"Không bỏ qua nghĩa vụ phối hợp phòng cháy, ứng phó sự cố hoặc phân định hậu quả."}],"example":"Nhà thầu gửi hóa đơn khi chưa có biên bản nghiệm thu. Quy trình thanh toán cần xem lại điều kiện hợp đồng.","deep":"Trang 17–21, Điều khoản 6–10.","time":8},{"id":"m4l5","module":"m4","title":"Nhận diện các điều khoản dễ tranh chấp","source":"contracts","pages":"22–25","why":"Phòng ngừa rủi ro bằng cách đọc hợp đồng có cấu trúc.","points":[{"label":"Không rõ phạm vi","body":"Thiếu danh mục công việc khiến hai bên hiểu khác nhau."},{"label":"Không có KPI","body":"Khó xác định dịch vụ đạt hay không."},{"label":"Thay đổi nhân sự/chi phí","body":"Nếu thiếu thông báo, chấp thuận và tiêu chí điều chỉnh sẽ dễ mâu thuẫn."},{"label":"Bảo mật và trách nhiệm","body":"Cần kiểm tra điều khoản PCCC, dữ liệu cư dân, bảo hiểm và bồi thường."}],"example":"Hợp đồng không ghi người phụ trách khi mất xe tại tầng hầm. Hãy xác định bộ chứng cứ cần xem trước khi kết luận.","deep":"Trang 22–25 và tổng kết 10 dấu hiệu rủi ro ở trang 52.","time":7},{"id":"m4l6","module":"m4","title":"Hợp đồng bảo trì công trình","source":"contracts","pages":"26–30","why":"Bảo trì cần tiêu chí kỹ thuật, lịch và nghiệm thu chặt chẽ hơn một yêu cầu sửa chữa chung.","points":[{"label":"Nhóm hạng mục","body":"Phần xây dựng, cơ điện, thiết bị và PCCC."},{"label":"Điều khoản bảo trì","body":"Phạm vi, vật tư, tiêu chuẩn, tiến độ, bảo hành, an toàn và trách nhiệm."},{"label":"Rủi ro thường gặp","body":"Thiếu mô tả vật tư, không kiểm tra hiện trường, không làm rõ nghiệm thu hoặc chi phí phát sinh."},{"label":"Giới hạn chuyên môn","body":"Chỉ kỹ thuật có thẩm quyền xác nhận thông số an toàn; điều phối viên theo dõi hồ sơ/quy trình."}],"example":"Nhà thầu đề nghị thay vật tư tương đương loại ban đầu. Không tự chấp thuận; cần hồ sơ kỹ thuật, phê duyệt và nghiệm thu đúng thẩm quyền.","deep":"Trang 26–30.","time":8},{"id":"m4l7","module":"m4","title":"Lựa chọn nhà thầu bằng quy trình","source":"contracts","pages":"31–33","why":"Chọn nhà thầu không nên chỉ dựa trên giá rẻ hoặc quen biết.","points":[{"label":"Xác định nhu cầu","body":"Viết yêu cầu, phạm vi, tiêu chí chất lượng và ngân sách."},{"label":"Mời và đánh giá","body":"Đối chiếu năng lực, kinh nghiệm, phương án, nhân sự, giá và rủi ro."},{"label":"Thương thảo và ký","body":"Lưu hồ sơ đề xuất, biên bản đánh giá, thương thảo, quyết định và hợp đồng."},{"label":"Giám sát sau ký","body":"Chọn đúng đơn vị mới chỉ là bước đầu; cần nghiệm thu theo KPI."}],"example":"Hai nhà thầu báo giá bằng nhau nhưng một bên không có kế hoạch thay nhân sự ca đêm. Rủi ro vận hành cần được đưa vào đánh giá.","deep":"Trang 31–33 và danh sách BM-01 đến BM-15 ở trang 42–44.","time":8},{"id":"m4l8","module":"m4","title":"Tranh chấp, chứng cứ và kiểm soát thực hiện","source":"contracts","pages":"34–52","why":"Quy trình có bằng chứng là yếu tố chung của nhiều tình huống tranh chấp.","points":[{"label":"Tình huống thường gặp","body":"Cắt giảm bảo vệ, chậm bảo trì, mất xe, lộ dữ liệu, chất lượng vệ sinh không đạt."},{"label":"Chứng cứ","body":"Hợp đồng, phụ lục, hình ảnh, nhật ký, hóa đơn, báo cáo và biên bản nghiệm thu."},{"label":"Bước xử lý","body":"Ghi nhận → kiểm tra điều khoản → xác minh chứng cứ → đề nghị khắc phục → nghiệm thu/đánh giá."},{"label":"Chuyển đúng thẩm quyền","body":"Các phương thức thương lượng, hòa giải, trọng tài, tòa án phụ thuộc điều kiện pháp luật và nội dung hợp đồng."}],"example":"Mất xe ở tầng hầm: thay vì khẳng định ai chịu trách nhiệm, trước tiên tra hợp đồng, nội quy, vé gửi xe, camera và nhật ký sự cố.","deep":"Trang 34–52, gồm tình huống, chứng cứ và các biểu mẫu.","time":10},{"id":"m5l1","module":"m5","title":"Tài chính tòa nhà: bức tranh tổng thể","source":"finance","pages":"2–4","why":"Quản lý dòng tiền là một phần của chất lượng dịch vụ và sự bền vững của vận hành.","points":[{"label":"Mục đích","body":"Lập kế hoạch thu – chi, theo dõi tài sản, hỗ trợ chủ động nguồn lực và kiểm soát rủi ro."},{"label":"Đối tượng","body":"Các bên có thể liên quan gồm chủ đầu tư, Ban quản trị, công ty vận hành, Ban quản lý."},{"label":"Khác biệt quan trọng","body":"Kinh phí vận hành thường kỳ và kinh phí bảo trì không nên nhập làm một."},{"label":"Tính minh bạch","body":"Dữ liệu phải có nguồn và quy trình xác nhận, không chỉ con số tổng."}],"example":"Ban quản lý cần giải thích vì sao phí vệ sinh tháng này tăng. Hãy yêu cầu bảng đối chiếu số giờ, đơn giá và khối lượng dịch vụ.","deep":"Trang 2–4.","time":6},{"id":"m5l2","module":"m5","title":"Bộ máy kế toán và phân quyền","source":"finance","pages":"5–7","why":"Người điều phối cần biết ai lập chứng từ, ai duyệt, ai theo dõi.","points":[{"label":"Cơ cấu BQL","body":"Tài liệu có sơ đồ Trưởng Ban quản lý, trợ lý/hành chính, kế toán, kỹ thuật, chăm sóc cư dân và giám sát."},{"label":"Phân nhiệm","body":"Kế toán, thủ quỹ và người phê duyệt có những đầu việc cần tách rõ theo quy định và quy chế nội bộ."},{"label":"Kiểm soát chéo","body":"Một giao dịch nên có chứng từ, phê duyệt và đối chiếu phù hợp."},{"label":"Tuyến báo cáo","body":"Khi có chênh lệch phải có đầu mối giải trình và quyết định."}],"example":"Nhân viên đề nghị tạm ứng mua vật tư. Không chỉ giao tiền; cần quy trình đề nghị, duyệt, quyết toán và lưu chứng từ.","deep":"Trang 5–7.","time":7},{"id":"m5l3","module":"m5","title":"Quy trình quỹ, tạm ứng, mua hàng và thu phí","source":"finance","pages":"8–11","why":"Công việc hằng ngày cần chạy theo quy trình để giảm sai sót.","points":[{"label":"Quỹ tiền mặt","body":"Thiết lập và kiểm tra sổ quỹ, tiền thực tế và nguyên tắc quản lý."},{"label":"Tạm ứng/hoàn ứng","body":"Xác định mục đích chi, thời hạn hoàn, chứng từ đi kèm."},{"label":"Mua hàng và kiểm kê","body":"Có đề nghị, duyệt, nghiệm thu, đối chiếu tài sản/vật tư."},{"label":"Thu phí","body":"Theo dõi khoản phải thu, tình trạng thanh toán và quy trình xử lý đúng quy định."}],"example":"Sau khi mua 20 bóng đèn, người mua chỉ gửi ảnh hóa đơn. Cần đối chiếu số lượng thực nhập và biên bản/phiếu nhập theo quy trình.","deep":"Trang 8–11.","time":7},{"id":"m5l4","module":"m5","title":"Cơ sở lập giá và ngân sách","source":"finance","pages":"12–14","why":"Dự toán tốt phải xuất phát từ phạm vi dịch vụ và phương pháp tính rõ ràng.","points":[{"label":"Nguồn pháp lý","body":"Slide dẫn Luật Nhà ở 2023 và Phụ lục VII Nghị định 95/2024 về phương pháp xác định giá."},{"label":"Đơn vị tính","body":"Giá dịch vụ thường được trình bày theo diện tích và thời gian; cần kiểm tra điều kiện áp dụng."},{"label":"Phạm vi đưa vào giá","body":"Không tự cộng lẫn khoản bảo trì, trông giữ xe hoặc bảo hiểm khi quy định yêu cầu tách biệt."},{"label":"Tính thận trọng","body":"Các công thức và điều kiện cụ thể phải tra văn bản hợp nhất trước khi sử dụng chính thức."}],"example":"Nếu ai đó hỏi “Vì sao phí quản lý là X đồng/m²?”, câu trả lời cần bắt đầu từ phương pháp tính và danh mục dịch vụ.","deep":"Trang 12–14; pháp luật hiện hành có thể sửa đổi.","time":8},{"id":"m5l5","module":"m5","title":"Nguồn thu của dự án","source":"finance","pages":"15, 21–23","why":"Không phải khoản tiền nào thu được cũng có cùng mục đích và chủ thể hưởng lợi.","points":[{"label":"Phí quản lý","body":"Nguồn thu dịch vụ từ các nhóm người sử dụng có nghĩa vụ theo quy định/hợp đồng."},{"label":"Khai thác chỗ đỗ xe","body":"Thu theo loại vé hoặc đối tượng nếu có cơ chế phù hợp."},{"label":"Khai thác tài sản chung","body":"Quảng cáo, vị trí dịch vụ hoặc tiện ích có thể tạo nguồn thu, phải xác định quyền sở hữu/quản lý."},{"label":"Kiểm tra tính hợp lệ","body":"Phân biệt nguồn thu của đơn vị vận hành với các khoản thuộc chủ thể khác."}],"example":"Bảng thu có dòng “quảng cáo thang máy”. Trước khi đưa vào ngân sách, cần kiểm tra thỏa thuận và chủ thể có quyền khai thác.","deep":"Trang 15, 21–23.","time":7},{"id":"m5l6","module":"m5","title":"Các nhóm chi phí vận hành","source":"finance","pages":"16–20, 24–27","why":"Đọc được cấu trúc chi phí giúp nhận ra nguồn gây vượt ngân sách.","points":[{"label":"Chi phí trực tiếp","body":"Năng lượng, vật tư, vận hành thiết bị, nhà thầu bảo vệ, vệ sinh và các dịch vụ liên quan."},{"label":"Chi phí quản lý","body":"Phần chi phí quản lý chung của đơn vị vận hành theo cơ chế tính giá."},{"label":"Lợi nhuận và thuế","body":"Trong tài liệu được nêu như các thành phần của giá dịch vụ, cần áp dụng đúng quy định hiện hành."},{"label":"Khoản phát sinh","body":"Vật tư thay thế, sửa chữa và yếu tố bất thường cần dự phòng, ghi nhận nguyên nhân."}],"example":"Chi điện hệ thống chung tăng 25% so với dự toán. Cần kiểm tra dữ liệu tiêu thụ, sự cố kỹ thuật và vận hành thiết bị trước khi kết luận lãng phí.","deep":"Trang 16–20, 24–27.","time":8},{"id":"m5l7","module":"m5","title":"Cân đối thu – chi và ngân sách cuối cùng","source":"finance","pages":"21, 28–30","why":"Đây là bước biến dự toán thành công cụ ra quyết định.","points":[{"label":"Ước tính doanh thu","body":"Từ các khoản thu đã có căn cứ, tránh tính hai lần."},{"label":"Phân tích chi","body":"Chia nhóm chi thường kỳ và phát sinh, kiểm tra giả định."},{"label":"Phân bổ","body":"Xác định nhóm đối tượng và phương pháp phân bổ theo quy định/hợp đồng."},{"label":"Kiểm tra và hiệu chỉnh","body":"So sánh thu – chi, tìm nguyên nhân chênh lệch, báo cáo đề xuất."}],"example":"Dự toán thu 400 triệu, chi 430 triệu mỗi tháng (số liệu giả định). Không tăng phí ngay: trước tiên kiểm tra giả định, khoản chi bất thường và nguồn dự phòng.","deep":"Trang 21, 28–30.","time":8},{"id":"m6l1","module":"m6","title":"Dự án mô phỏng: Tòa nhà Ánh Dương","source":null,"pages":"","why":"Bạn vừa gia nhập nhóm vận hành tòa nhà giả định 18 tầng, đang chuẩn bị tiếp nhận bàn giao.","points":[{"label":"Bối cảnh","body":"Dự án giả định có 240 căn hộ, 2 thang máy, bãi xe và các nhà thầu bảo vệ, vệ sinh."},{"label":"Nhiệm vụ 1","body":"Nhận diện ai cần tham gia việc bàn giao và phê duyệt."},{"label":"Nhiệm vụ 2","body":"Tìm những loại hồ sơ và chứng từ nên kiểm tra."},{"label":"Nhiệm vụ 3","body":"Sắp xếp ưu tiên vận hành, nhà thầu, tài chính và truyền thông cư dân."},{"label":"Nguyên tắc","body":"Bạn không phải chuyên gia kỹ thuật hay luật sư; hãy ghi rõ phần cần chuyển người có chuyên môn xác minh."}],"example":"Tình huống giả định: còn thiếu hướng dẫn vận hành hệ thống bơm, hợp đồng vệ sinh chỉ ghi “thực hiện định kỳ”, dự toán chi đang lớn hơn thu. Người học cần không ký nhận “đầy đủ”, yêu cầu làm rõ KPI và kiểm tra giả định ngân sách.","deep":"Toàn bộ số liệu, tên dự án và tình huống là mô phỏng học tập.","time":10}],"questions":{"m1":[{"id":"m1q1","lesson":"m1l1","q":"Cơ sở đáng tin nhất để xác định một diện tích là chung hay riêng là gì?","opts":["Ý kiến của một cư dân","Hợp đồng và hồ sơ pháp lý, bản vẽ liên quan","Cách khu vực đang được sử dụng","Lời giới thiệu của môi giới"],"answer":1,"why":"Không suy đoán quyền sở hữu từ vị trí hoặc lời nói; cần đối chiếu hồ sơ và quy định (luật tr.5–6)."},{"id":"m1q2","lesson":"m1l2","q":"Khi có tranh cãi về quyền sử dụng chỗ đỗ xe, bước đầu nên làm gì?","opts":["Tự phân lại chỗ đỗ","Ghi nhận vấn đề và kiểm tra hồ sơ, nội quy","Cho người đến trước quyết định","Ngừng toàn bộ hoạt động bãi xe"],"answer":1,"why":"Slide về chỗ để xe nhấn mạnh việc xác định đúng căn cứ sở hữu/quản lý (tr.7–9)."}],"m2":[{"id":"m2q1","lesson":"m2l1","q":"Vì sao kiểm kê hồ sơ khi bàn giao?","opts":["Chỉ để đủ số tập giấy","Để xác định đủ/thiếu và tình trạng tài liệu","Để bỏ các bản vẽ","Để tránh lập biên bản"],"answer":1,"why":"Hồ sơ cần gắn với danh mục kiểm tra và hiện trạng thực tế (tr.6–13)."},{"id":"m2q2","lesson":"m2l2","q":"Khi danh mục có máy bơm nhưng thực tế chưa kiểm thấy, làm gì?","opts":["Ký nhận đủ","Ghi ngoại lệ và yêu cầu kiểm tra","Xóa mục máy bơm","Đoán đang ở kho"],"answer":1,"why":"Bàn giao phải phản ánh hiện trạng, không giả định (tr.11–13)."}],"m3":[{"id":"m3q1","lesson":"m3l1","q":"Pre-opening diễn ra khi nào?","opts":["Sau khi đã vận hành nhiều năm","Trước khi dự án hoạt động chính thức","Chỉ khi thanh lý hợp đồng","Chỉ ngày trả lương"],"answer":1,"why":"Đây là giai đoạn chuẩn bị cho vận hành (tr.2–6)."},{"id":"m3q2","lesson":"m3l2","q":"Tài liệu có nhóm bộ phận nào trong BQL?","opts":["Kỹ thuật, kế toán, dịch vụ, giám sát","Chỉ kế toán","Chỉ ban marketing","Chỉ nhà thầu"],"answer":0,"why":"Sơ đồ trang 8 thể hiện nhiều nhóm phối hợp."}],"m4":[{"id":"m4q1","lesson":"m4l1","q":"Hợp đồng giúp những việc nào?","opts":["Giao việc, kiểm soát, thanh toán, trách nhiệm","Chỉ đặt logo","Chỉ giới thiệu doanh nghiệp","Không có tác dụng vận hành"],"answer":0,"why":"Tài liệu trang 5 giải thích vai trò hợp đồng."},{"id":"m4q2","lesson":"m4l1","q":"Hợp đồng bảo trì thang máy thuộc nhóm nào?","opts":["Quản lý tài sản riêng","Hợp đồng bảo trì","Hợp đồng khai thác quảng cáo","Biên bản Hội nghị"],"answer":1,"why":"Tài liệu chia 4 nhóm hợp đồng, trang 6."}],"m5":[{"id":"m5q1","lesson":"m5l1","q":"Tại sao phải quản lý tài chính tòa nhà?","opts":["Chủ động nguồn lực, theo dõi thu chi và tài sản","Chỉ để vẽ biểu đồ","Để không cần lưu hồ sơ","Để thay vai trò kỹ thuật"],"answer":0,"why":"Tài liệu trang 2–4 về mục đích quản lý tài chính."},{"id":"m5q2","lesson":"m5l2","q":"Bộ phận nào có trong sơ đồ Ban quản lý?","opts":["Kế toán–thủ quỹ","Chỉ phòng quảng cáo","Chỉ giám đốc công ty khác","Không có bộ phận tài chính"],"answer":0,"why":"Sơ đồ tr.6–7 có kế toán/thủ quỹ."}]},"scenarios":{},"glossary":[{"term":"Ban quản trị (BQT)","meaning":"Nhóm được hình thành theo cơ chế quản lý nhà chung cư để thực hiện nhiệm vụ theo thẩm quyền.","source":"law","pages":"14–28"},{"term":"Ban quản lý tòa nhà (BQLTN)","meaning":"Bộ phận triển khai công việc vận hành tại dự án, thường do doanh nghiệp vận hành tổ chức.","source":"finance","pages":"5–7"},{"term":"Chủ đầu tư (CĐT)","meaning":"Chủ thể đầu tư dự án với trách nhiệm liên quan phát triển và bàn giao theo pháp luật.","source":"handover","pages":"6–13"},{"term":"Đơn vị QLVH","meaning":"Doanh nghiệp cung cấp dịch vụ quản lý vận hành theo điều kiện và hợp đồng phù hợp.","source":"law","pages":"29–33"},{"term":"Hội nghị nhà chung cư","meaning":"Cơ chế tập hợp chủ sở hữu tham gia quyết định các vấn đề thuộc thẩm quyền.","source":"law","pages":"11–13"},{"term":"Phần sở hữu chung","meaning":"Bộ phận, diện tích hoặc trang thiết bị thuộc sở hữu chung theo hồ sơ và quy định.","source":"law","pages":"5–6"},{"term":"Phần sở hữu riêng","meaning":"Phần được xác định thuộc một chủ sở hữu riêng theo căn cứ pháp lý.","source":"law","pages":"5–6"},{"term":"Kinh phí bảo trì","meaning":"Khoản tiền dùng cho việc bảo trì phần sở hữu chung theo chế độ pháp lý tương ứng.","source":"handover","pages":"31–43"},{"term":"Phí dịch vụ QLVH","meaning":"Khoản phí gắn với việc cung cấp dịch vụ quản lý vận hành, phân biệt với tiền bảo trì.","source":"finance","pages":"12–16"},{"term":"Pre-opening","meaning":"Giai đoạn chuẩn bị nhân sự, hồ sơ, tài sản, nhà thầu và quy trình trước hoạt động chính thức.","source":"projects","pages":"2–24"},{"term":"Operations","meaning":"Giai đoạn tổ chức vận hành thường kỳ để bảo đảm dịch vụ ổn định.","source":"projects","pages":"25–33"},{"term":"Hồ sơ hoàn công","meaning":"Hồ sơ thể hiện tình trạng công trình đã thực hiện, phục vụ bàn giao và quản lý.","source":"handover","pages":"44–47"},{"term":"Bản vẽ kỹ thuật","meaning":"Tài liệu mô tả hệ thống, cấu tạo hoặc bố trí hạng mục kỹ thuật.","source":"handover","pages":"20–25"},{"term":"CO/CQ","meaning":"Chứng từ liên quan nguồn gốc/chất lượng thiết bị, cần đối chiếu theo loại vật tư và yêu cầu.","source":"handover","pages":"10"},{"term":"PCCC","meaning":"Phòng cháy, chữa cháy; gồm yêu cầu, hệ thống, tài liệu và quy trình ứng phó liên quan.","source":"handover","pages":"8–10"},{"term":"Biên bản bàn giao","meaning":"Tài liệu ghi nhận danh mục, tình trạng, thời điểm và các bên xác nhận bàn giao.","source":"handover","pages":"9–13"},{"term":"Tài sản cố định (TSCĐ)","meaning":"Nhóm tài sản cần quản lý, kiểm kê và theo dõi theo quy trình tài chính của dự án.","source":"finance","pages":"8–10"},{"term":"Công cụ dụng cụ (CCDC)","meaning":"Dụng cụ phục vụ công việc, cần có quy trình cấp phát và kiểm kê.","source":"projects","pages":"30"},{"term":"Vật tư tiêu hao (VTTH)","meaning":"Vật tư sử dụng trong vận hành theo định mức và có theo dõi xuất nhập tồn.","source":"projects","pages":"30"},{"term":"KPI","meaning":"Chỉ số đánh giá hiệu quả/chất lượng của một công việc hoặc dịch vụ.","source":"contracts","pages":"15–16"},{"term":"SLA","meaning":"Mức cam kết dịch vụ về thời gian hoặc chất lượng, dùng làm ví dụ thiết kế tiêu chuẩn; thuật ngữ mở rộng.","source":"contracts","pages":"15–16"},{"term":"Nhà thầu phụ","meaning":"Đơn vị được thuê cung cấp công việc/dịch vụ chuyên biệt cho dự án.","source":"projects","pages":"19–21"},{"term":"Nghiệm thu","meaning":"Bước kiểm tra và ghi nhận kết quả công việc so với yêu cầu trước thanh toán/bàn giao.","source":"contracts","pages":"29–30"},{"term":"Tạm ứng","meaning":"Khoản tiền cấp trước cho công việc theo quy trình có chứng từ và hoàn ứng.","source":"finance","pages":"8–9"},{"term":"Hoàn ứng","meaning":"Quyết toán khoản tạm ứng bằng chứng từ và số tiền thực chi.","source":"finance","pages":"8–9"},{"term":"Dự toán","meaning":"Ước tính nguồn lực và các khoản thu, chi cho kỳ hoặc hoạt động nhất định.","source":"finance","pages":"21–30"},{"term":"Ngân sách vận hành","meaning":"Kế hoạch thu–chi phục vụ hoạt động tòa nhà theo kỳ.","source":"finance","pages":"21–30"},{"term":"Bảo trì định kỳ","meaning":"Hoạt động bảo trì có kế hoạch theo lịch hoặc quy trình của hệ thống/công trình.","source":"contracts","pages":"26–30"},{"term":"Bảo hành","meaning":"Trách nhiệm khắc phục trong điều kiện và thời hạn bảo hành theo hồ sơ/hợp đồng.","source":"projects","pages":"17–18"},{"term":"Biên bản vi phạm","meaning":"Văn bản ghi nhận công việc không đạt yêu cầu hoặc vi phạm điều khoản.","source":"contracts","pages":"42–44"},{"term":"Chăm sóc cư dân","meaning":"Cung cấp thông tin, tiếp nhận yêu cầu, hỗ trợ xử lý và phản hồi người sử dụng.","source":"projects","pages":"29"},{"term":"Quy trình xử lý sự cố","meaning":"Chuỗi bước ghi nhận, đánh giá, chuyển xử lý, theo dõi và thông báo.","source":"projects","pages":"32–33"}],"final":[],"official":[{"name":"Luật Nhà ở số 27/2023/QH15 – CSDL VBPL","url":"https://vbpl.vn/TW/Pages/ivbpq-thuoctinh.aspx?ItemID=169032","note":"CSDL ghi nhận hết hiệu lực một phần tại thời điểm tra cứu 03/11/2026."},{"name":"Nghị định 95/2024/NĐ-CP – Cổng Chính phủ","url":"https://vanban.chinhphu.vn/?classid=0&docid=210761&pageid=27160","note":"Văn bản gốc; kiểm tra văn bản sửa đổi trước khi áp dụng."},{"name":"Tìm văn bản liên quan Thông tư 05/2024/TT-BXD","url":"https://vbpl.vn/","note":"Tra cứu hiệu lực, sửa đổi và văn bản hợp nhất trong cơ sở dữ liệu chính thức."}],"updated":"03/11/2026"};</script><script>(() => {

  m4:['Xác định phạm vi','Theo dõi chất lượng','Nghiệm thu và xử lý vấn đề'],

function nav(current){const read=link(lastTopic());return `<nav class="bottom-nav" aria-label="Điều hướng chính"><a href="#/home" class="${current==='home'?'active':''}"><span class="glyph" aria-hidden="true">⌂</span>Tổng quan</a><a href="${read}" class="${current==='read'?'active':''}"><span class="glyph" aria-hidden="true">▤</span>Đọc nội dung</a><a href="#/terms" class="${current==='terms'?'active':''}"><span class="glyph" aria-hidden="true">⌕</span>Thuật ngữ</a></nav>`;}
function shell(content, current){return `<div class="top-progress" aria-hidden="true"><div id="read-progress"></div></div><header class="site-head"><div class="head-inner"><a class="identity" href="#/home">QUẢN LÝ VẬN HÀNH<small>NHÀ CHUNG CƯ · TỰ HỌC</small></a><div class="head-links"><a href="#/home" class="${current==='home'?'active':''}">Tổng quan</a><a href="${link(lastTopic())}" class="${current==='read'?'active':''}">Đọc bài</a><a href="#/terms" class="${current==='terms'?'active':''}">Thuật ngữ</a></div></div></header>${content}${nav(current)}`;}
function topicOverview(m,i){return `<li class="map-item"><span class="map-no">${i+1}</span><div><a href="${link(m.id)}">${escapeHtml(m.title)}</a><p>${escapeHtml(m.subtitle)} · ${lessonList(m.id).length} mục</p></div><span class="map-arrow" aria-hidden="true">›</span></li>`;}
function home(){const m0=D.lessons.filter(l=>l.module==='m0');const intro=m0[0];const resume=getTopic(memory.last);
return `<main class="wrap"><section class="hero"><p class="eyebrow">Góc tự học · 5 chuyên đề</p><h1>Hiểu nghề quản lý vận hành chung cư, từ tổng quan đến chi tiết</h1><p class="intro">Một nơi đọc và học lại nội dung từ 5 tài liệu đào tạo. Mỗi chủ đề là một trang cuộn liên tục: đọc lần lượt, xem ví dụ ngay tại chỗ, không cần mở nhiều lớp bài học.</p><a class="btn" href="${link(resume?.id||'m1')}">${resume?'Tiếp tục: '+escapeHtml(resume.title):'Bắt đầu đọc chủ đề 1'} <span aria-hidden="true">→</span></a>${resume && memory.positions?.[resume.id]>120?`<a href="${link(resume.id)}" class="floating-resume" data-resume="${resume.id}">Quay lại vị trí đã đọc</a>`:''}</section><section aria-label="Bức tranh chung"><h2>Quản lý vận hành là làm gì?</h2><p>${escapeHtml(intro.points[0].body)}</p><div class="summary-grid"><div><strong>Con người</strong><p>Chăm sóc cư dân, điều phối nhân sự và các nhóm dịch vụ.</p></div><div><strong>Hệ thống tòa nhà</strong><p>Tiếp nhận hồ sơ, giám sát kỹ thuật, bảo trì và an toàn.</p></div><div><strong>Quy trình – nguồn lực</strong><p>Quản lý hợp đồng, chi phí và báo cáo hoạt động.</p></div></div><div class="simple-note"><p><b>Ví dụ:</b> ${escapeHtml(intro.example)}</p></div></section><section class="read-map" id="chu-de"><h2>5 chủ đề để đọc theo thứ tự</h2><p class="muted">Chọn chủ đề bất kỳ. Mỗi lần chỉ cần mở một trang, cuộn xuống để đọc các mục bên trong.</p><ol class="map-list">${MAIN.map(topicOverview).join('')}</ol></section><section class="quiet-heading"><h2>Thử hình dung công việc thực tế</h2><div class="simple-note"><p><b>Tình huống tổng hợp (mô phỏng):</b> ${escapeHtml(D.lessons.find(l=>l.module==='m6')?.example||'')}</p></div><h2 style="margin-top:32px">Đọc như thế nào?</h2><p>Đọc từ phần khái quát, sau đó xem từng ý chính và ví dụ trong công việc. Cuối chủ đề có vài câu tự ôn <strong>không tính điểm</strong>; có thể bỏ qua nếu chỉ muốn đọc.</p><p>Ở mỗi chủ đề, bạn có thể chạm vào tên mục trong <strong>mục lục</strong> để cuộn thẳng tới phần cần xem.</p></section><section class="sources"><h2>Nguồn học liệu</h2><p>Nội dung được viết lại để dễ đọc từ các slide PDF, không thay thế văn bản pháp luật hoặc khóa đào tạo cấp chứng nhận.</p><details><summary>Xem danh sách 5 tài liệu nguồn</summary><ul>${Object.values(D.sources).map(s=>`<li>${escapeHtml(s.name)} (${s.pages} trang)</li>`).join('')}</ul></details></section><footer class="site-footer">Tự học độc lập · Ưu tiên điện thoại · Kiến thức pháp lý cần đối chiếu văn bản đang có hiệu lực.</footer></main>`;}
function processGraph(id){const v=diagrams[id];return `<div class="flow" aria-label="Sơ đồ nội dung khái quát"><p class="flow-label">Nhìn nhanh mạch kiến thức</p><ol>${v.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ol></div>`;}
function renderLesson(l,index){let source='Tổng hợp phục vụ tự học';if(l.source && D.sources[l.source])source=D.sources[l.source].short+(l.pages?' · tr. '+escapeHtml(l.pages):'');let points=l.points.map(p=>`<div class="point"><h3>${escapeHtml(p.label)}</h3><p>${escapeHtml(p.body)}</p></div>`).join('');return `<section class="lesson" id="${l.id}"><div class="lesson-index">Mục ${index+1}</div><h2>${escapeHtml(l.title)}</h2><div class="why"><b>Vì sao cần biết?</b>${escapeHtml(l.why)}</div>${points}${l.example?`<aside class="example"><b>Ví dụ trong công việc</b><p>${escapeHtml(l.example)}</p></aside>`:''}<p class="source-line">Nguồn học liệu: ${source}</p></section>`;}
function selfReview(mid){const questions=(D.questions[mid]||[]).slice(0,2);if(!questions.length)return '';return `<aside class="review"><h2>Nếu muốn, tự ôn trong 1 phút</h2><p class="review-sub">Chỉ 2 câu gợi nhớ, không cần làm bài kiểm tra hay xem điểm.</p>${questions.map((q,i)=>`<details><summary>${i+1}. ${escapeHtml(q.q)}</summary><div class="answer"><b>Đáp án:</b> ${escapeHtml(q.opts[q.answer])}<p>${escapeHtml(q.why)}</p></div></details>`).join('')}</aside>`;}
function topic(mid){const m=getTopic(mid)||MAIN[0],list=lessonList(m.id),index=MAIN.findIndex(x=>x.id===m.id);memory.last=m.id;save();const ref=list.filter(l=>l.deep).map(l=>`<li><b>${escapeHtml(l.title)}:</b> ${escapeHtml(l.deep)}</li>`).join('');const prev=MAIN[index-1],next=MAIN[index+1];return `<main class="reading-wrap"><a class="back-link" href="#/home">← Trở về tổng quan</a><header class="topic-head"><p class="eyebrow">Chủ đề ${index+1} / 5</p><h1>${escapeHtml(m.title)}</h1><p class="sub">${escapeHtml(m.subtitle)}. Các phần nội dung được trình bày liên tục để bạn dễ theo dõi.</p><span class="time">${list.length} mục đọc · khoảng ${duration(m)} phút</span></header>${processGraph(m.id)}<nav class="toc" aria-label="Mục lục chủ đề"><h2>Trong chủ đề này</h2><ol>${list.map(l=>`<li><a href="#${l.id}" data-jump="${l.id}">${escapeHtml(l.title)}</a></li>`).join('')}</ol></nav>${m.id==='m1'?`<div class="simple-note"><p><b>Lưu ý:</b> Slide có trích văn bản pháp luật có thể đã được sửa đổi. Nội dung này chỉ để học; khi áp dụng cần kiểm tra văn bản hiện hành.</p></div>`:''}${list.map(renderLesson).join('')}<details class="deep-ref"><summary>Xem ghi chú chuyên sâu và căn cứ tài liệu</summary><ol>${ref}</ol></details>${selfReview(m.id)}<nav class="next-topic" aria-label="Chuyển chủ đề">${prev?`<a href="${link(prev.id)}">← Chủ đề ${index}: ${escapeHtml(prev.title)}</a>`:'<a href="#/home">← Tổng quan</a>'}${next?`<a href="${link(next.id)}">Chủ đề ${index+2}: ${escapeHtml(next.title)} →</a>`:'<a href="#/home">Về trang tổng quan →</a>'}</nav><footer class="site-footer">Học liệu diễn giải từ nguồn PDF. Tình huống có thể là ví dụ mô phỏng; không thay cho hướng dẫn nghiệp vụ tại đơn vị vận hành.</footer></main>`;}
function terms(){return `<main class="reading-wrap"><a href="#/home" class="back-link">← Trở về tổng quan</a><p class="eyebrow">Tra cứu nhanh</p><h1 class="dictionary-title">Thuật ngữ quản lý vận hành chung cư</h1><p class="intro">Các khái niệm thường gặp trong 5 tài liệu, sắp xếp để bạn tìm lại khi đang đọc.</p><label for="term-search" class="screen-reader">Tìm thuật ngữ</label><input id="term-search" class="searchbox" type="search" placeholder="Nhập từ cần tìm (ví dụ: Ban quản trị)" autocomplete="off" aria-controls="term-list"><dl class="terms" id="term-list">${D.glossary.map(g=>`<div class="term"><dt>${escapeHtml(g.term)}</dt><dd>${escapeHtml(g.meaning)}</dd></div>`).join('')}</dl><p class="empty" id="no-terms" hidden>Không tìm thấy thuật ngữ phù hợp.</p></main>`;}
function render(){let r=route();let which = r.startsWith('read/')?'read':r==='terms'?'terms':'home';app.innerHTML=shell(which==='read'?topic(r.split('/')[1]):which==='terms'?terms():home(),which);document.title=(which==='read'?getTopic(r.split('/')[1])?.title+' – ':'')+'Tự học quản lý vận hành chung cư';window.scrollTo({top:0,behavior:'instant'});updateScroll();}
function updateScroll(){const r=route();if(r.startsWith('read/')){const mid=r.split('/')[1];const max=document.documentElement.scrollHeight-innerHeight;const y=scrollY;const bar=document.getElementById('read-progress');if(bar)bar.style.width=(max>0?Math.round(100*y/max):0)+'%';memory.positions=memory.positions||{};memory.positions[mid]=y;save();}}
let scrollId=null;window.addEventListener('scroll',()=>{if(scrollId)return;scrollId=window.setTimeout(()=>{scrollId=null;updateScroll();},180);},{passive:true});
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){e.preventDefault();document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});}const resume=e.target.closest('[data-resume]');if(resume){e.preventDefault();const mid=resume.dataset.resume,y=memory.positions?.[mid]||0;location.hash=link(mid);window.setTimeout(()=>window.scrollTo({top:y,behavior:'smooth'}),50);}});
document.addEventListener('input',e=>{if(e.target.id!=='term-search')return;const value=e.target.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let count=0;document.querySelectorAll('.term').forEach(el=>{const matched=el.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(value);el.hidden=!matched;if(matched)count++;});const msg=document.getElementById('no-terms');if(msg)msg.hidden=count>0;});
render();
})();
</script></body></html>
