function renderCheckpoint(l,q){const chosen=runtime.checkpoint[l.id]||[],checked=runtime.checkpointChecked[l.id],done=data.completed.includes(l.id);return `<div class="mini-quiz"><div class="question-heading">${h(q.q)}</div>${renderChoices(q,chosen,l.id,'checkchoice',!!checked)}${checked?`<div class="feedback ${checked.good?'good':'bad'}"><strong>${checked.good?'Đúng rồi!':'Chưa chính xác, hãy thử lại.'}</strong>${h(q.why)}</div>`:''}<div class="quiz-actions"><button class="button small" data-checksubmit="${h(l.id)}" ${!chosen.length||checked?.good?'disabled':''}>${done?'Đã hoàn thành':'Kiểm tra đáp án'}</button>${checked&&!checked.good?`<button class="button small outline" data-checkretry="${h(l.id)}">Thử lại</button>`:''}</div><div class="smallprint" style="margin-top:9px">${isMulti(q)?'Chọn tất cả đáp án đúng.':'Chọn một đáp án.'} Trả lời đúng để đánh dấu bài học hoàn thành.</div></div>`;}

function quizPage(mid){const m=D.modules.find(x=>x.id===mid);if(!m)return notFound();const qs=mid==='m6'?D.final.map((a,i)=>({id:'final'+i,q:a[0],opts:a[1],answer:a[2],why:a[3]})):D.questions[mid];let s=runtime.quiz[mid];if(!s){s={index:0,answers:{},verified:{},result:null};runtime.quiz[mid]=s;}if(s.result!==null){return `<main class="page">${heading('Kết quả bài kiểm tra',m.title,'TỔNG KẾT & PHẢN HỒI')}<div class="panel quiz-result"><div class="eyebrow">BẠN ĐÃ HOÀN THÀNH ${qs.length} CÂU HỎI</div><div class="result-figure ${s.result>=80?'result-good':'result-bad'}">${s.result}%</div><h2>${s.result>=80?'Đã đạt mục tiêu kiểm tra':'Cần ôn tập thêm một chút'}</h2><p class="results-note">${s.result>=80?'Bạn đã đạt tiêu chí tự đánh giá của module. Kết quả chỉ phục vụ tự học, không phải chứng nhận nghề nghiệp.':'Hãy xem lại các bài có câu trả lời sai, thử làm thêm tình huống và làm lại khi đã sẵn sàng.'}</p><div class="quiz-actions" style="justify-content:center"><button class="button outline" data-route="module/${mid}">Về module</button><button class="button" data-startquiz="${mid}">${icon('restart')} Làm lại bài kiểm tra</button></div></div></main>`;}
const idx=s.index,q=qs[idx],selected=s.answers[idx]||[],verified=s.verified[idx];return `<main class="page"><div class="breadcrumbs"><a href="${href('module/'+mid)}">${h(m.title)}</a>${icon('chevron')} Bài kiểm tra</div><div class="quiz-wrap"><p class="eyebrow">ASSESSMENT · ${h(m.eyebrow)}</p><h1 class="page-title">Tự kiểm tra hiểu biết</h1><p class="question-count">Câu ${idx+1} trên ${qs.length} · Đạt khi đúng tối thiểu 80%</p><div class="quiz-progress">${qs.map((_,i)=>`<i class="${i<=idx?'done':''}"></i>`).join('')}</div><div class="panel quiz-card"><div class="section-tag">${icon('brain')} ${isMulti(q)?'Chọn nhiều đáp án':'Chọn một đáp án'}</div><h2>${h(q.q)}</h2>${renderChoices(q,selected,`${mid}:${idx}`,'quizchoice',!!verified)}${verified?`<div class="feedback ${verified.good?'good':'bad'}"><strong>${verified.good?'Chính xác!':'Câu trả lời chưa đúng.'}</strong>${h(q.why)}<br><span style="font-weight:700">Đáp án: ${[...(isMulti(q)?q.answer:[q.answer])].map(v=>String.fromCharCode(65+v)).join(', ')}.</span></div>`:''}<div class="quiz-actions">${verified?`<button class="button full" data-quiznext="${mid}">${idx===qs.length-1?'Xem kết quả':'Câu tiếp theo'} ${icon('arrow')}</button>`:`<button class="button full" data-quizsubmit="${mid}" ${!selected.length?'disabled':''}>Kiểm tra đáp án</button>`}</div></div><p class="smallprint" style="margin-top:14px">Sau khi kiểm tra một câu, bạn sẽ xem được giải thích trước khi sang câu tiếp theo.</p></div></main>`;}
function practicePage(){const mid=runtime.practiceTab;const m=D.modules.find(x=>x.id===mid);const list=D.scenarios[mid]||[];const done=Object.values(data.scenarioDone).filter(Boolean).length;return `<main class="page">${heading('Luyện tập & ôn kiến thức','Câu hỏi kiến thức, tình huống nghề nghiệp và flashcard. Sai cũng hữu ích — vì bạn luôn nhận được giải thích.')}
<div class="stats"><div class="panel stat"><div class="num">${done}<span style="font-size:14px">/10</span></div><div class="muted">Tình huống đã giải</div></div><div class="panel stat"><div class="num">${data.flashKnown.length}</div><div class="muted">Thuật ngữ đã biết</div></div><div class="panel stat"><div class="num">${Object.values(data.scores).filter(x=>x.best>=80).length}</div><div class="muted">Module đạt 80%</div></div></div><div class="section-heading"><h2 class="section-title">Thực hành tình huống</h2></div><div class="tabs" role="tablist" aria-label="Chủ đề tình huống">${D.modules.filter(x=>D.scenarios[x.id]).map(x=>`<button class="tab ${mid===x.id?'active':''}" role="tab" aria-selected="${mid===x.id}" data-practicetab="${x.id}">${h(x.eyebrow)}</button>`).join('')}</div><p class="section-sub">${h(m.title)} · tình huống mô phỏng từ nội dung tài liệu.</p>${list.map((sc,i)=>scenarioCard(mid,i,sc)).join('')}<div class="section-heading"><h2 class="section-title">Kiểm tra theo module</h2></div><div class="grid-module">${D.modules.filter(m=>m.id!=='m6').map(m=>`<div class="panel" style="padding:16px"><div class="section-tag">${icon(m.icon)} ${h(m.eyebrow)}</div><h3 style="margin:2px 0 7px;font-size:15px">${h(m.title)}</h3><p class="section-sub">${D.questions[m.id].length} câu · Điểm cao nhất ${data.scores[m.id]?.best??'—'}%</p><button class="button small outline" data-startquiz="${m.id}" style="margin-top:12px">Bắt đầu</button></div>`).join('')}</div><div class="section-heading"><h2 class="section-title">Flashcards</h2><a class="text-link" href="#/cards">Ôn toàn bộ thuật ngữ</a></div><div class="learning-tip"><div class="square-icon">${icon('brain')}</div><div style="flex:1"><strong>32 thuật ngữ chuyên môn</strong><p>Lật thẻ, tự nhớ định nghĩa, đánh dấu phần cần ôn.</p></div><button class="button small outline" data-route="cards">Ôn tập</button></div><div class="section-heading"><h2 class="section-title">Tình huống tổng hợp</h2></div><div class="panel" style="padding:20px"><div class="eyebrow">CAPSTONE PRACTICE</div><h3 style="margin:0 0 7px">Tòa nhà Ánh Dương – từ bàn giao đến vận hành</h3><p class="section-sub">Tích hợp pháp luật, hồ sơ, vận hành, hợp đồng và ngân sách trong một tình huống duy nhất.</p><button class="button" style="margin-top:15px" data-route="challenge">Thử thách cuối khóa ${icon('arrow')}</button></div></main>`;}
function scenarioCard(mid,i,sc){const key=mid+':'+i;const sel=runtime.checkpoint['sc:'+key]||[],done=data.scenarioDone[key];return `<div class="panel scenario-card"><span class="section-tag gold-text">${icon('light')} Tình huống ${i+1}</span><h3>${h(sc.title)}</h3><p>${h(sc.context)}</p><div class="choice-list">${sc.choices.map((c,j)=>`<button class="choice ${sel.includes(j)?'selected':''} ${done&&j===sc.answer?'correct':''}" data-scenariochoice="${key}:${j}" ${done?'disabled':''}><span class="choice-dot">${sel.includes(j)?'✓':String.fromCharCode(65+j)}</span>${h(c)}</button>`).join('')}</div>${done?`<div class="feedback good"><strong>Đã hoàn thành</strong>${h(sc.feedback)}</div>`:`<button class="button small" data-scenariosubmit="${key}" ${!sel.length?'disabled':''} style="margin-top:12px">Kiểm tra quyết định</button>`}</div>`;}
function cardsPage(){const known=data.flashKnown.length;return `<main class="page">${heading('Flashcard thuật ngữ','Tự nghĩ định nghĩa trước khi lật thẻ. Những thẻ bạn đã nhớ được có thể đánh dấu để tập trung ôn các phần còn lại.')}<div class="learning-tip"><div class="square-icon">${icon('brain')}</div><div><strong>${known}/${D.glossary.length} thuật ngữ đã biết</strong><p>Tiến độ được lưu trên thiết bị. Chạm thẻ để lật mặt.</p></div></div><div class="flashcard-grid">${D.glossary.map((x,i)=>`<div class="panel flash-card"><div><span class="eyebrow">THẺ ${i+1}/${D.glossary.length}</span><div class="term">${h(x.term)}</div>${runtime.flashFlip[i]?`<div class="meaning" style="margin-top:11px">${h(x.meaning)}</div>`:`<p class="section-sub">Bạn có thể tự giải thích thuật ngữ này không?</p>`}</div><div class="flash-actions"><button class="button small outline" data-flip="${i}">${runtime.flashFlip[i]?'Ẩn định nghĩa':'Lật xem đáp án'}</button><button class="button small ${data.flashKnown.includes(i)?'':'outline'}" data-known="${i}">${data.flashKnown.includes(i)?'✓ Đã biết':'Cần ôn'}</button></div><small>${h(D.sources[x.source]?.short)} · Tr. ${h(x.pages)}</small></div>`).join('')}</div></main>`;}
function referenceResults(){const q=runtime.search.trim().toLocaleLowerCase('vi');const ascii=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase();const match=s=>ascii(s).includes(ascii(q));const gs=D.glossary.filter(g=>!q||match(g.term+' '+g.meaning));const ls=q?D.lessons.filter(l=>match(l.title+' '+l.why+' '+l.points.map(p=>p.label+' '+p.body).join(' '))):[];return `<div class="section-heading"><div><h2 class="section-title">Thuật ngữ ${q?'phù hợp':'cần nhớ'}</h2><p class="section-sub">${gs.length} thuật ngữ${q?` · ${ls.length} bài học liên quan`:''}</p></div></div><div class="glossary-list">${gs.map(g=>`<div class="panel glossary-card"><strong>${h(g.term)}</strong><p>${h(g.meaning)}</p><small>PDF: ${h(D.sources[g.source]?.short)} · Trang ${h(g.pages)}</small></div>`).join('')||'<div class="empty">Không thấy thuật ngữ phù hợp.</div>'}</div>${q?`<div class="section-heading"><h2 class="section-title">Bài học liên quan</h2></div><div class="lesson-list">${ls.map(l=>lessonRow(l,moduleLessons(l.module).indexOf(l))).join('')||'<div class="empty">Chưa có bài học trùng khớp.</div>'}</div>`:''}`;}
function referencePage(){return `<main class="page">${heading('Từ điển & nguồn tham chiếu','Tra cứu thuật ngữ, khái niệm pháp luật và vị trí trang PDF gốc mà không phải học lại từ đầu.')}<div class="searchbox">${icon('search')}<input id="reference-search" type="search" value="${h(runtime.search)}" placeholder="Tìm: Ban quản trị, KPI, kinh phí..." aria-label="Tìm thuật ngữ và bài học" autocomplete="off"></div><div id="search-results">${referenceResults()}</div><div class="section-heading"><h2 class="section-title">Nguồn văn bản pháp luật để đối chiếu</h2></div>${legalBanner()}<div class="glossary-list" style="margin-top:13px">${D.official.map(x=>`<div class="panel glossary-card"><strong>${h(x.name)}</strong><p>${h(x.note)}</p><a class="text-link" href="${h(x.url)}" target="_blank" rel="noopener noreferrer">Mở nguồn chính thức ${icon('arrow')}</a></div>`).join('')}</div><div class="section-heading"><h2 class="section-title">5 tài liệu nguồn</h2></div>${Object.values(D.sources).map(x=>`<div class="panel glossary-card" style="margin-bottom:8px"><strong>${h(x.name)}</strong><p>${h(x.remark)}</p><small>${x.pages} trang · file PDF do người học cung cấp, không đăng công khai trong ứng dụng</small></div>`).join('')}</main>`;}
function progressPage(){const mastered=Object.values(data.scores).filter(s=>s.best>=80).length;return `<main class="page">${heading('Tiến độ học tập','Báo cáo cá nhân được lưu cục bộ trong trình duyệt. Bạn có thể sao lưu và chuyển sang thiết bị khác bằng file JSON.')}<div class="panel progress-summary"><div class="progress-ring" style="--deg:${overall()*3.6}deg"><div>${overall()}%</div></div><p style="text-align:center;font-size:13px;color:var(--sub);margin:14px 0 2px">${data.completed.length} trên ${D.lessons.length} bài đã hoàn thành</p></div><div class="progress-layout"><div class="panel progress-stat"><strong>${data.opened.length}</strong><span>Bài đã mở</span></div><div class="panel progress-stat"><strong>${mastered}</strong><span>Module có quiz đạt ≥80%</span></div><div class="panel progress-stat"><strong>${data.bookmarked.length}</strong><span>Bài đã lưu</span></div></div><div class="section-heading"><h2 class="section-title">Tiến độ theo module</h2></div><div class="panel" style="padding:18px">${D.modules.map((m,i)=>`<div style="margin-bottom:${i===D.modules.length-1?'0':'17px'}"><div class="progress-label"><strong style="color:var(--ink)">${h(m.title)}</strong><span>${moduleDone(m.id)}/${countLessons(m.id)} · ${modPercent(m.id)}%</span></div>${pct(modPercent(m.id))}${data.scores[m.id]?`<small class="smallprint">Điểm kiểm tra cao nhất: ${data.scores[m.id].best}%</small>`:''}</div>`).join('')}</div><div class="section-heading"><h2 class="section-title">Các bài đã lưu</h2></div><div class="lesson-list">${data.bookmarked.map(x=>D.lessons.find(z=>z.id===x)).filter(Boolean).map(x=>lessonRow(x,moduleLessons(x.module).indexOf(x))).join('')||'<div class="empty">Chưa lưu bài nào. Trong trang bài học, chọn “Lưu bài” để xem lại tại đây.</div>'}</div><div class="section-heading"><h2 class="section-title">Dữ liệu của bạn</h2></div><div class="panel form-panel"><h3 style="margin:0 0 5px">Sao lưu và chuyển thiết bị</h3><p>Tiến độ chỉ nằm trên trình duyệt/thiết bị này; không tự đồng bộ qua điện thoại hoặc máy tính khác. Xuất JSON để lưu riêng, sau đó nhập ở thiết bị khác.</p><div class="quiz-actions"><button class="button outline" data-export>${icon('download')} Xuất tiến độ</button><button class="button outline" data-import>${icon('upload')} Nhập tiến độ</button><input id="import-file" class="sr-only" type="file" accept=".json,application/json"/></div><hr class="divider"><button class="button small ghost" data-reset>${icon('trash')} Xóa tiến độ trên thiết bị này</button></div></main>`;}
function challengePage(){const q=D.final;let answers=runtime.checkpoint.challenge||{};const done=Object.keys(answers).length;return `<main class="page">${heading('Thử thách tòa nhà Ánh Dương','Một kịch bản tổng hợp để luyện cách ra quyết định khi chuẩn bị nhận bàn giao và bắt đầu vận hành.','CAPSTONE · TÌNH HUỐNG MÔ PHỎNG')}<div class="panel" style="padding:19px;margin:0 0 16px"><p class="eyebrow">BỐI CẢNH GIẢ ĐỊNH</p><h2 class="section-title">Một tòa nhà 18 tầng, 240 căn hộ</h2><p class="section-sub" style="margin-top:9px">Đội vận hành chuẩn bị tiếp nhận: còn thiếu hướng dẫn máy bơm, KPI vệ sinh chưa rõ và dự toán chi đang vượt thu. Bạn không cần biết mọi câu trả lời ngay, nhưng phải quyết định điều gì cần kiểm tra và chuyển tuyến.</p><div class="line-graphic"><div class="step">Tiếp nhận</div><div class="arrow">›</div><div class="step">Tổ chức</div><div class="arrow">›</div><div class="step">Kiểm soát</div></div></div><div class="section-heading"><h2 class="section-title">6 quyết định phải đưa ra</h2><span class="pill">${done}/6 đã trả lời</span></div>${q.map((a,i)=>`<div class="panel scenario-card"><span class="section-tag">QUYẾT ĐỊNH ${i+1}</span><h3>${h(a[0])}</h3><div class="choice-list">${a[1].map((x,j)=>`<button class="choice ${answers[i]===j?'selected':''} ${answers[i]!==undefined&&j===a[2]?'correct':''}" data-challengechoice="${i}:${j}" ${answers[i]!==undefined?'disabled':''}><span class="choice-dot">${String.fromCharCode(65+j)}</span>${h(x)}</button>`).join('')}</div>${answers[i]!==undefined?`<div class="feedback ${answers[i]===a[2]?'good':'bad'}"><strong>${answers[i]===a[2]?'Quyết định phù hợp':'Hãy ghi nhớ phương án tốt hơn'}</strong>${h(a[3])}</div>`:''}</div>`).join('')}${done===6?`<div class="panel quiz-result"><div class="eyebrow">HOÀN THÀNH TÌNH HUỐNG</div><div class="result-figure result-good">${Math.round(100*q.filter((a,i)=>answers[i]===a[2]).length/6)}%</div><p class="results-note">Kết quả là phần tự đánh giá một tình huống giả định, không thay thế đánh giá nghề tại hiện trường.</p><button class="button" data-startquiz="m6">Tiếp tục kiểm tra 6 câu ${icon('arrow')}</button></div>`:''}</main>`;}
function notFound(){return `<main class="page"><div class="empty"><h3>Không tìm thấy nội dung</h3><p>Trang này có thể đã được đổi đường dẫn.</p><button class="button" data-route="home">Về trang chủ</button></div></main>`;}
let lastRoute='';
function render(noScroll=false){const r=route(),p=r.split('/');let inner;if(r==='home')inner=dashboard();else if(r==='path')inner=pathPage();else if(r==='practice')inner=practicePage();else if(r==='reference')inner=referencePage();else if(r==='progress')inner=progressPage();else if(r==='cards')inner=cardsPage();else if(r==='challenge')inner=challengePage();else if(p[0]==='module')inner=modulePage(p[1]);else if(p[0]==='lesson')inner=lessonPage(p[1]);else if(p[0]==='quiz')inner=quizPage(p[1]);else inner=notFound();const y=window.scrollY;$('#app').innerHTML=appShell(inner);document.title=(p[0]==='lesson'?D.lessons.find(l=>l.id===p[1])?.title+' – ':'')+'Building Operations Learning Hub';if(lastRoute!==r&&!noScroll){window.scrollTo({top:0,behavior:'instant'});}else if(noScroll){requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));}lastRoute=r;}
function addSelected(list,index,multi){if(multi)return list.includes(index)?list.filter(i=>i!==index):[...list,index];return[index]}
function markLesson(id){if(!data.completed.includes(id)){data.completed.push(id);save();}showToast('Bài học đã được ghi nhận hoàn thành.');render(true);}
document.addEventListener('click',e=>{const target=e.target.closest('[data-anchor],[data-route],[data-bookmark],[data-checkchoice],[data-checksubmit],[data-checkretry],[data-marklesson],[data-startquiz],[data-quizchoice],[data-quizsubmit],[data-quiznext],[data-practicetab],[data-scenariochoice],[data-scenariosubmit],[data-flip],[data-known],[data-challengechoice],[data-export],[data-import],[data-reset]');if(!target)return;e.preventDefault();const a=target.dataset;
if(a.anchor){document.getElementById(a.anchor)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a.route){navigate(a.route);return;}
if(a.bookmark){data.bookmarked=data.bookmarked.includes(a.bookmark)?data.bookmarked.filter(x=>x!==a.bookmark):[...data.bookmarked,a.bookmark];save();render(true);showToast(data.bookmarked.includes(a.bookmark)?'Đã lưu bài học.':'Đã bỏ lưu bài học.');return;}
if(a.checkchoice){const raw=a.checkchoice;const i=+raw.split(':').pop(),lid=raw.slice(0,raw.lastIndexOf(':'));const l=D.lessons.find(x=>x.id===lid),q=D.questions[l?.module]?.find(q=>q.lesson===lid);if(!q||runtime.checkpointChecked[lid])return;runtime.checkpoint[lid]=addSelected(runtime.checkpoint[lid]||[],i,isMulti(q));render(true);return;}
if(a.checksubmit){const lid=a.checksubmit,l=D.lessons.find(x=>x.id===lid),q=D.questions[l.module]?.find(q=>q.lesson===lid);const choice=runtime.checkpoint[lid]||[];if(!choice.length)return;const good=correct(q,choice);runtime.checkpointChecked[lid]={good};if(good&&!data.completed.includes(lid)){data.completed.push(lid);save();}render(true);if(good)showToast('Đúng rồi — bạn đã hoàn thành bài học!');return;}
if(a.checkretry){delete runtime.checkpointChecked[a.checkretry];runtime.checkpoint[a.checkretry]=[];render(true);return;}
if(a.marklesson){markLesson(a.marklesson);return;}
if(a.startquiz){quizStart(a.startquiz);return;}
if(a.quizchoice){const bits=a.quizchoice.split(':'),mid=bits[0],idx=+bits[1],opt=+bits[2],s=runtime.quiz[mid],qs=mid==='m6'?D.final.map((v,i)=>({answer:v[2]})):D.questions[mid];if(!s||s.verified[idx])return;const q=qs[idx];s.answers[idx]=addSelected(s.answers[idx]||[],opt,Array.isArray(q.answer));render(true);return;}
if(a.quizsubmit){const mid=a.quizsubmit,s=runtime.quiz[mid],qs=mid==='m6'?D.final.map(v=>({answer:v[2]})):D.questions[mid],q=qs[s.index],ans=s.answers[s.index]||[];if(!ans.length)return;s.verified[s.index]={good:correct(q,ans)};render(true);return;}
if(a.quiznext){const mid=a.quiznext,s=runtime.quiz[mid],len=mid==='m6'?D.final.length:D.questions[mid].length;if(s.index<len-1){s.index++;render(true);window.scrollTo({top:0,behavior:'instant'});}else{const correctN=Object.values(s.verified).filter(x=>x.good).length;const score=Math.round(correctN/len*100);s.result=score;const old=data.scores[mid];data.scores[mid]={last:score,best:Math.max(old?.best||0,score),attempts:(old?.attempts||0)+1};save();render();window.scrollTo({top:0,behavior:'instant'});}return;}
if(a.practicetab){runtime.practiceTab=a.practicetab;render(true);return;}
if(a.scenariochoice){const bits=a.scenariochoice.split(':'),key=bits[0]+':'+bits[1],op=+bits[2];if(data.scenarioDone[key])return;runtime.checkpoint['sc:'+key]=[op];render(true);return;}
if(a.scenariosubmit){const key=a.scenariosubmit,bits=key.split(':'),sc=D.scenarios[bits[0]]?.[+bits[1]],ans=(runtime.checkpoint['sc:'+key]||[])[0];if(!sc||ans===undefined)return;if(ans!==sc.answer){showToast('Chưa đúng. Hãy xem lại tình huống và chọn lại.');runtime.checkpoint['sc:'+key]=[];render(true);return;}data.scenarioDone[key]=true;save();render(true);showToast('Đã giải đúng tình huống!');return;}
if(a.flip!==undefined){const idx=+a.flip;runtime.flashFlip[idx]=!runtime.flashFlip[idx];render(true);return;}
if(a.known!==undefined){const idx=+a.known;data.flashKnown=data.flashKnown.includes(idx)?data.flashKnown.filter(x=>x!==idx):[...data.flashKnown,idx];save();render(true);return;}
if(a.challengechoice){const [i,j]=a.challengechoice.split(':').map(Number);runtime.checkpoint.challenge=runtime.checkpoint.challenge||{};if(runtime.checkpoint.challenge[i]!==undefined)return;runtime.checkpoint.challenge[i]=j;if(Object.keys(runtime.checkpoint.challenge).length===6){const good=D.final.filter((q,index)=>q[2]===runtime.checkpoint.challenge[index]).length;showToast(`Đã trả lời ${good}/6 quyết định phù hợp.`);}render(true);return;}
if(a.export!==undefined){const payload=JSON.stringify({...data,exportedAt:new Date().toISOString(),course:'building-operations-learning-hub'},null,2);const blob=new Blob([payload],{type:'application/json'});const url=URL.createObjectURL(blob),anc=document.createElement('a');anc.href=url;anc.download='building-operations-progress.json';document.body.appendChild(anc);anc.click();anc.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Đã xuất file sao lưu tiến độ.');return;}
if(a.import!==undefined){$('#import-file')?.click();return;}
if(a.reset!==undefined){if(!confirm('Xóa toàn bộ tiến độ tự học trên thiết bị này? Hành động không thể hoàn tác nếu chưa sao lưu.'))return;data=defaultStore();save();runtime.quiz={};runtime.checkpoint={};runtime.checkpointChecked={};render(true);showToast('Đã xóa tiến độ trên thiết bị.');return;}
});
document.addEventListener('input',e=>{if(e.target?.id==='reference-search'){runtime.search=e.target.value;const target=$('#search-results');if(target)target.innerHTML=referenceResults();}});
document.addEventListener('change',async e=>{if(e.target?.id!=='import-file')return;const file=e.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(payload?.version!==1||!Array.isArray(payload.completed)||!Array.isArray(payload.opened)||!Array.isArray(payload.bookmarked)||typeof payload.scores!=='object')throw Error('Invalid');const lessonIds=new Set(D.lessons.map(x=>x.id));const clean={...defaultStore(),...payload};clean.opened=unique(payload.opened.filter(x=>lessonIds.has(x)));clean.completed=unique(payload.completed.filter(x=>lessonIds.has(x)));clean.bookmarked=unique(payload.bookmarked.filter(x=>lessonIds.has(x)));clean.flashKnown=(payload.flashKnown||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<D.glossary.length);clean.lastLesson=lessonIds.has(payload.lastLesson)?payload.lastLesson:null;delete clean.exportedAt;delete clean.course;data=clean;save();render(true);showToast('Đã nhập tiến độ học tập.');}catch(err){showToast('File không đúng định dạng sao lưu của ứng dụng.');}finally{e.target.value='';}});
window.addEventListener('hashchange',()=>render());
if(!location.hash)location.hash='#/home';render();
})();

</script></body></html>
